<style>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const S={ex:[],rec:[],cfg:{},today:istNow(),page:'dash',sel:'',date:'',am:'',hm:'',hf:'',cmp:'',ai:'',rid:null,busy:0,charts:{},synced:null};
const PAGES=[['dash','Home'],['ex','Exercises'],['track','Track'],['an','Analytics'],['hist','History'],['set','Settings']];
const PAL=['#d4b472','#6f9bc4','#7fb59a','#c4879b','#9a8bd1','#b0a595'];
const I={dash:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',ex:'<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',track:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',an:'<path d="M5 20V11M12 20V4M19 20v-6"/>',hist:'<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',set:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',

const API = 'https://script.google.com/macros/s/AKfycbxynpTTd4a4hKaz0fcwecWy3jD6AP6iw35yDjgzRlaTwIPDOdwlZ9WJtPX_Vf9KbkxgJg/exec';

function call(action,p){

if(d.edit){ask({title:'Edit set '+d.n,input:1,num:1,value:d.v,ok:'Save'}).then(v=>{if(v===null)return;if(!/^\d{1,6}$/.test(v)||+v<1)return toast('Enter repetitions as a whole number above 0','err');simple('editSet',{id:d.edit,reps:v},'Set updated')});return}
if(d.rm){ask({title:'Delete this set?',msg:'The remaining sets are renumbered.',ok:'Delete',bad:1}).then(v=>v&&simple('deleteSet',{id:d.rm},'Set deleted'));return}
if(d.ren){const o=nm(d.ren);ask({title:'Rename exercise',input:1,value:o,ok:'Save'}).then(v=>v&&v!==o&&simple('renameExercise',{id:d.ren,name:v},'Exercise renamed'));return}
if(d.del){ask({title:'Delete "'+nm(d.del)+'"?',msg:'It is archived. Past records stay in History.',ok:'Delete',bad:1}).then(v=>v&&simple('deleteExercise',{id:d.del},'Exercise deleted'));return}
if(d.a==='addSet')return addSet();if(d.a==='sync')return simple('list',{},'Synced');
if(d.a==='reset'){ask({title:"Reset today's display?",msg:'Nothing is deleted. History is unaffected.',ok:'Reset'}).then(v=>v&&simple('resetToday',{},"Today's display reset"));return}
if(d.a==='restore')return simple('restoreToday',{},'Showing all of today');
if(d.a==='addEx'){const i=$('#newEx'),v=i.value.trim();if(!v)return toast('Enter a name','err');call('addExercise',{name:v}).then(ok=>ok&&toast('Exercise added'))}});
document.addEventListener('change',e=>{const k=e.target.dataset.f;if(!k)return;let v=e.target.value;if(k==='date'){if(!v||v>S.today)return;S.rid=null}S[k]=v;if(k==='date')S.hm=v.slice(0,7);render()});
document.addEventListener('input',e=>{if(e.target.id==='reps')e.target.value=e.target.value.replace(/\D/g,'')});
document.addEventListener('keydown',e=>{const d=$('#dlg');if(d.classList.contains('show')){if(e.key==='Escape'){$('#dc').click();return}
if(e.key==='Tab'){const f=[...d.querySelectorAll('input,button')].filter(x=>x.offsetParent),i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}return}
if(e.key!=='Enter')return;if(e.target.id==='reps')addSet();if(e.target.id==='newEx')document.querySelector('[data-a=addEx]').click()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(istNow()!==S.today){S.date=S.am=S.hm='';}call('list')}});
$('#nav').innerHTML='<div class="brand"><i></i>RepTrack</div>'+PAGES.map(p=>`<button data-p="${p[0]}" aria-label="${p[1]}">${ic(p[0])}<span>${p[1]}</span></button>`).join('');
$('#app').innerHTML=skel();call('list');
</script></body></html>
